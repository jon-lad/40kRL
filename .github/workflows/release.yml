name: Release Build

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (overrides tag). Leave empty when triggered by tag push.'
        required: false
        type: string
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release

permissions:
  contents: write

env:
  VCPKG_DEFAULT_TRIPLET: x64-windows
  VCPKG_ROOT: C:\vcpkg

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Resolve version and configuration
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CONFIGURATION: ${{ inputs.configuration }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Use manual input if provided, otherwise use the tag name
          if [ -n "$INPUT_VERSION" ]; then
            echo "RELEASE_VERSION=$INPUT_VERSION" >> $GITHUB_ENV
          else
            echo "RELEASE_VERSION=$REF_NAME" >> $GITHUB_ENV
          fi
          # Use manual input if provided, otherwise default to Release
          if [ -n "$INPUT_CONFIGURATION" ]; then
            echo "BUILD_CONFIG=$INPUT_CONFIGURATION" >> $GITHUB_ENV
          else
            echo "BUILD_CONFIG=Release" >> $GITHUB_ENV
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Cache vcpkg packages
        id: vcpkg-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: C:\vcpkg\installed
          key: vcpkg-x64-windows-${{ hashFiles('vcpkg-overlay/**') }}
          restore-keys: vcpkg-x64-windows-

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat

      - name: Install dependencies via vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          C:\vcpkg\vcpkg.exe install libtcod:x64-windows sol2:x64-windows lua:x64-windows --overlay-ports=${{ github.workspace }}/vcpkg-overlay/ports

      - name: Integrate vcpkg
        run: C:\vcpkg\vcpkg.exe integrate install

      - name: Build solution
        run: msbuild 40kRL.sln /p:Configuration=${{ env.BUILD_CONFIG }} /p:Platform=x64

      - name: Copy runtime DLLs
        run: |
          $outDir = "x64\${{ env.BUILD_CONFIG }}"
          $vcpkgBin = "C:\vcpkg\installed\x64-windows\bin"
          $vcpkgDbgBin = "C:\vcpkg\installed\x64-windows\debug\bin"
          if ("${{ env.BUILD_CONFIG }}" -eq "Debug") {
            Copy-Item "$vcpkgDbgBin\*.dll" "$outDir\" -Force -ErrorAction SilentlyContinue
          }
          Copy-Item "$vcpkgBin\*.dll" "$outDir\" -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path "$outDir\SDL3.dll")) {
            Write-Error "SDL3.dll not found in $outDir"
            exit 1
          }

      - name: Run tests
        timeout-minutes: 5
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          $testExe = "x64\${{ env.BUILD_CONFIG }}\40kRL_Tests.exe"
          if (Test-Path $testExe) {
            & $testExe --reporter compact "~[pbt]"
          } else {
            Write-Error "Test executable not found at $testExe"
            exit 1
          }

      - name: Set artifact name
        shell: bash
        run: |
          echo "ARTIFACT_NAME=40kRL-${{ env.RELEASE_VERSION }}-${{ env.BUILD_CONFIG }}" >> $GITHUB_ENV

      - name: Stage release files
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item "x64\${{ env.BUILD_CONFIG }}\40kRL.exe" release\
          Copy-Item "x64\${{ env.BUILD_CONFIG }}\*.dll" release\ -Force
          Copy-Item Scripts release\Scripts\ -Recurse -Force
          Copy-Item menu_background1.png release\
          Copy-Item terminal.png release\
          # Copy MSVC runtime redistributable DLLs
          $vcRedist = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($vcRedist) {
            Copy-Item "$($vcRedist.FullName)\vcruntime140.dll" release\ -ErrorAction SilentlyContinue
            Copy-Item "$($vcRedist.FullName)\vcruntime140_1.dll" release\ -ErrorAction SilentlyContinue
            Copy-Item "$($vcRedist.FullName)\msvcp140.dll" release\ -ErrorAction SilentlyContinue
          }
          # Copy libtcod data files if present
          if (Test-Path "C:\vcpkg\installed\x64-windows\share\libtcod\data") {
            Copy-Item "C:\vcpkg\installed\x64-windows\share\libtcod\data\*" release\ -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release/

      - name: Zip release folder
        run: Compress-Archive -Path release\* -DestinationPath "40kRL-${{ env.RELEASE_VERSION }}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: ${{ env.RELEASE_VERSION }}
          files: 40kRL-${{ env.RELEASE_VERSION }}.zip
          generate_release_notes: true
